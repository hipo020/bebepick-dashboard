<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf6">
<title>베베픽 주문 옵션 조회</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fffaf6;color:#2d2926;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:680px;margin:auto;padding:22px 14px 80px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{margin:0;font-size:24px}
.sub{margin-top:5px;color:#8a817b;font-size:13px}
.back{padding:9px 11px;border:1px solid #eee5df;border-radius:12px;background:#fff;color:#2d2926;text-decoration:none;font-size:13px}
.main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px;padding:4px;background:#f1ebe6;border-radius:14px}
.main-tab{text-align:center;text-decoration:none;color:#786f69;padding:10px 8px;border-radius:11px;font-size:13px;font-weight:750}
.main-tab.on{background:#fff;color:#2d2926;box-shadow:0 2px 8px rgba(70,50,35,.08)}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.detail{padding:10px;border-radius:12px;background:#faf8f6;border:1px solid #f0e8e2}
.detail .k{font-size:11px;color:#8a817b;margin-bottom:4px}
.detail .v{font-size:13px;font-weight:700;word-break:break-all}
.memo{margin-top:10px;padding:11px;border-radius:12px;background:#faf8f6;border:1px solid #f0e8e2}
.memo .k{font-size:11px;color:#8a817b;margin-bottom:5px}
.memo .v{font-size:13px;white-space:pre-wrap;word-break:break-word}
.item-meta{margin-top:5px;font-size:11px;color:#8a817b;line-height:1.55}
.section-title{font-size:13px;font-weight:800;margin:14px 0 6px}
.box{margin-top:16px;background:#fff;border:1px solid #eee5df;border-radius:16px;padding:14px;box-shadow:0 5px 18px rgba(70,50,35,.06)}
.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
input{width:100%;min-width:0;border:1px solid #e8ded7;border-radius:12px;padding:13px 14px;font:inherit;text-transform:uppercase;outline:none}
button{border:0;border-radius:12px;padding:0 16px;background:#2d2926;color:#fff;font:inherit;font-weight:750}
.note{margin-top:9px;color:#8a817b;font-size:12px;line-height:1.5}
#result{margin-top:14px}
.empty{padding:30px 8px;text-align:center;color:#8a817b}
.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.order-no{font-weight:800;font-size:16px}
.meta{font-size:12px;color:#8a817b;line-height:1.55}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.flag{padding:16px 12px;border-radius:14px;text-align:center;border:1px solid #eee5df;background:#faf8f6}
.flag b{display:block;font-size:21px;margin-top:5px}
.flag.yes{background:#effaf3;border-color:#c9ead3}
.flag.no{background:#f7f4f2;color:#8a817b}
.items{border-top:1px dashed #eee5df;margin-top:10px;padding-top:10px}
.item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f5efeb}
.item:last-child{border-bottom:0}
.item-name{font-weight:700}
.badge{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:999px;background:#f3eee9;font-size:10px;color:#665e58;vertical-align:1px}
.total{margin-top:12px;display:flex;justify-content:space-between;font-weight:800}
.err{padding:14px;border-radius:12px;background:#fff2f2;color:#a12929;border:1px solid #efcaca}
.loading{padding:26px;text-align:center;color:#8a817b}
.saved-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.saved-title{font-size:14px;font-weight:800}
.saved-sub{font-size:11px;color:#8a817b;margin-top:3px}
.ghost{width:36px;height:36px;padding:0;border:1px solid #e8ded7;background:#faf8f6;color:#655d57;border-radius:10px}
.saved-list{display:grid;gap:8px;margin-top:12px}
.saved-empty{padding:18px 6px;text-align:center;color:#8a817b;font-size:12px}
.saved-order{width:100%;padding:11px 12px;border:1px solid #eee5df;background:#faf8f6;color:#2d2926;border-radius:12px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.saved-order:active{transform:scale(.995)}
.saved-order-no{font-size:13px;font-weight:800}
.saved-order-meta{margin-top:3px;font-size:11px;color:#8a817b;line-height:1.45}
.saved-total{font-size:13px;font-weight:800;white-space:nowrap}
.save-state{font-size:11px;color:#238636;margin-top:8px}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <h1>📦 주문 옵션 조회</h1>
      <div class="sub">주문번호로 보관·개봉 여부 확인</div>
    </div>
    <a class="back" href="./">재고판 ←</a>
  </div>

  <nav class="main-tabs" aria-label="베베픽 도구">
    <a class="main-tab" href="./">🧸 재고표</a>
    <a class="main-tab on" href="./order.html">📦 주문옵션 조회</a>
  </nav>

  <section class="box">
    <div class="search">
      <input id="orderNo" inputmode="text" autocomplete="off" placeholder="예: BP261007AD3D">
      <button id="lookup" type="button">조회</button>
    </div>
    <div class="note">정확한 주문번호가 있어야 조회돼. 주문·상품·옵션 정보는 최대한 보여주고, 전화번호·주소·회원명 같은 개인정보는 표시하지 않아.</div>
  </section>

  <section class="box">
    <div class="saved-head">
      <div>
        <div class="saved-title">🗂️ 내 주문내역</div>
        <div class="saved-sub">이 기기에서 직접 조회한 주문만 자동 저장돼</div>
      </div>
      <button id="savedRefresh" class="ghost" type="button" aria-label="저장 주문 새로고침">↻</button>
    </div>
    <div id="savedOrders" class="saved-list"><div class="saved-empty">저장된 주문 불러오는 중…</div></div>
  </section>

  <section id="result"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const BEBEPICK_URL = "https://kswhgzweesuwacgqruok.supabase.co";
const BEBEPICK_KEY = "sb_publishable_XSYCZ48RRSxjI24XoR9CUg_-D5ae3KV";
const EDGE_URL = "https://fergbabqmwnbkkxjvgkj.supabase.co/functions/v1/bebepick-dashboard";
const VAULT_STORAGE_KEY = "bebepick_order_vault_v1";
const sb = window.supabase.createClient(BEBEPICK_URL, BEBEPICK_KEY, {
  auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
});

const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString("ko-KR");

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function timeKst(iso){
  if(!iso) return "";
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return "";
  return new Intl.DateTimeFormat("ko-KR",{
    timeZone:"Asia/Seoul",year:"numeric",month:"numeric",day:"numeric",
    hour:"2-digit",minute:"2-digit",hour12:false
  }).format(d);
}
function statusText(s){
  return ({pending:"접수/대기",paid:"결제완료",completed:"완료",cancelled:"취소"})[s] || s || "";
}
function flagHtml(label,on,text){
  return '<div class="flag '+(on?'yes':'no')+'"><span>'+label+'</span><b>'+esc(text ?? (on?'YES ✓':'NO'))+'</b></div>';
}

function safeMemoText(memo){
  const text=String(memo || "").trim();
  if(!text) return "없음";
  const remainder=text
    .replace(/\[보관\]/g,"")
    .replace(/\[(미개봉|개봉|카드개봉)\]/g,"")
    .replace(/[\s,./|·-]/g,"");
  return remainder ? "보관·개봉 외 메모 원문은 개인정보 보호를 위해 표시하지 않음" : text;
}

function vaultToken(){
  let token="";
  try{ token=localStorage.getItem(VAULT_STORAGE_KEY) || ""; }catch{}
  if(token) return token;

  const bytes=new Uint8Array(32);
  crypto.getRandomValues(bytes);
  token=btoa(String.fromCharCode(...bytes))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  try{ localStorage.setItem(VAULT_STORAGE_KEY,token); }catch{}
  return token;
}

async function orderVaultRequest(method,body){
  const res=await fetch(EDGE_URL+"?api=orders",{
    method,
    cache:"no-store",
    headers:{
      "content-type":"application/json",
      "x-order-vault":vaultToken()
    },
    body:body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    const text=await res.text();
    throw new Error("내 주문 저장소 HTTP "+res.status+" · "+text.slice(0,120));
  }
  return res.json();
}

function savedOptionText(o){
  const bits=[];
  if(o.storage_option) bits.push(o.storage_option);
  if(o.opening_option && o.opening_option!=="확인 불가") bits.push(o.opening_option);
  return bits.join(" · ");
}

function renderSavedOrders(rows){
  const box=$("savedOrders");
  const list=Array.isArray(rows)?rows:[];
  if(!list.length){
    box.innerHTML='<div class="saved-empty">아직 저장된 주문이 없어.<br>위에서 주문번호를 조회하면 자동으로 여기에 쌓여.</div>';
    return;
  }

  box.innerHTML=list.map(o=>{
    const items=Array.isArray(o.items)?o.items:[];
    const names=items.map(x=>String(x.name||"")).filter(Boolean);
    const productText=names.slice(0,2).join(", ")+(names.length>2?" 외 "+(names.length-2)+"개":"");
    const opt=savedOptionText(o);
    return '<button class="saved-order" type="button" data-order-no="'+esc(o.order_no||"")+'">'+
      '<div>'+
        '<div class="saved-order-no">'+esc(o.order_no||"")+'</div>'+
        '<div class="saved-order-meta">'+
          esc(timeKst(o.order_created_at)||"시각 없음")+
          (opt?' · '+esc(opt):'')+
          (productText?'<br>'+esc(productText):'')+
        '</div>'+
      '</div>'+
      '<div class="saved-total">'+fmt(o.total_amount)+'원</div>'+
    '</button>';
  }).join("");
}

async function loadSavedOrders(){
  try{
    const data=await orderVaultRequest("GET");
    renderSavedOrders(data.orders||[]);
  }catch(e){
    $("savedOrders").innerHTML='<div class="saved-empty">내 주문내역을 불러오지 못했어.</div>';
    console.warn(e);
  }
}

async function saveViewedOrder(order,items,storage,opening){
  const safeItems=(Array.isArray(items)?items:[]).map(x=>({
    id:Number.isFinite(Number(x.id))?Number(x.id):null,
    doll_id:Number.isFinite(Number(x.doll_id))?Number(x.doll_id):null,
    name:String(x.doll_name||"상품"),
    quantity:Number(x.quantity||0),
    price:Number(x.price||x.doll_price||0),
    option:String(x.option||"")
  }));

  await orderVaultRequest("POST",{
    order_no:String(order.order_no||"").toUpperCase(),
    order_id:Number.isFinite(Number(order.id))?Number(order.id):null,
    status:String(order.status||""),
    order_created_at:order.created_at||null,
    total_amount:Number(order.total_amount||0),
    storage_option:storage,
    opening_option:opening,
    items:safeItems
  });
}

async function lookup(){
  const orderNo=$("orderNo").value.trim().toUpperCase();
  if(!orderNo){
    $("result").innerHTML='<div class="box err">주문번호를 입력해줘.</div>';
    return;
  }

  $("result").innerHTML='<div class="box loading">조회하는 중…</div>';
  $("lookup").disabled=true;

  try{
    const {data,error}=await sb.rpc("get_order_by_no",{p_order_no:orderNo});
    if(error) throw error;
    if(!data || !data.order){
      $("result").innerHTML='<div class="box empty">해당 주문번호를 찾지 못했어.</div>';
      return;
    }

    const order=data.order || {};
    const items=Array.isArray(data.items)?data.items:[];
    const memo=String(order.customer_memo || "");
    const keep=/\[보관\]/.test(memo);
    const openMatch=memo.match(/\[(미개봉|개봉|카드개봉)\]/);
    const openType=openMatch ? openMatch[1] : "확인 불가";
    const itemsTotal=items.reduce((sum,x)=>{
      const unit=Number(x.price || x.doll_price || 0);
      return sum + unit * Number(x.quantity || 0);
    },0);
    const shipping=Math.max(0,Number(order.total_amount || 0)-itemsTotal);

    const itemHtml=items.length ? items.map(x=>{
      const qty=Number(x.quantity || 0);
      const itemPrice=Number(x.price || 0);
      const dollPrice=Number(x.doll_price || 0);
      const unitPrice=itemPrice || dollPrice;
      const opt=String(x.option || "");
      return '<div class="item">'+
        '<div><div class="item-name">'+esc(x.doll_name || "상품")+
        (opt?'<span class="badge">'+esc(opt)+'</span>':'')+
        '</div>'+
        '<div class="item-meta">'+
          'item ID '+esc(x.id ?? "—")+
          ' · doll ID '+esc(x.doll_id ?? "—")+
          '<br>수량 '+fmt(qty)+
          ' · 주문단가 '+fmt(itemPrice)+'원'+
          ' · 상품기준가 '+fmt(dollPrice)+'원'+
          (opt?'<br>원본 옵션 '+esc(opt):'')+
        '</div></div>'+
        '<div><b>'+fmt(unitPrice*qty)+'원</b></div>'+
      '</div>';
    }).join("") : '<div class="empty">상품 정보가 없어.</div>';

    $("result").innerHTML=
      '<section class="box">'+
        '<div class="head">'+
          '<div><div class="order-no">'+esc(order.order_no || orderNo)+'</div>'+
          '<div class="meta">'+esc(timeKst(order.created_at))+(order.status?' · '+esc(statusText(order.status)):'')+'</div>'+
          '<div id="saveState" class="save-state">내 주문내역에 저장 중…</div></div>'+
        '</div>'+
        '<div class="flags">'+
          flagHtml("📦 보관",keep,keep?"보관":"발송")+
          flagHtml("✂️ 개봉 방식",openType!=="확인 불가",openType)+
        '</div>'+
        '<div class="section-title">주문 상세</div>'+
        '<div class="details">'+
          '<div class="detail"><div class="k">주문 내부 ID</div><div class="v">'+esc(order.id ?? "—")+'</div></div>'+
          '<div class="detail"><div class="k">주문번호</div><div class="v">'+esc(order.order_no || orderNo)+'</div></div>'+
          '<div class="detail"><div class="k">상태</div><div class="v">'+esc(statusText(order.status))+(order.status?' ('+esc(order.status)+')':'')+'</div></div>'+
          '<div class="detail"><div class="k">생성시각</div><div class="v">'+esc(timeKst(order.created_at) || "—")+'</div></div>'+
          '<div class="detail"><div class="k">상품 합계</div><div class="v">'+fmt(itemsTotal)+'원</div></div>'+
          '<div class="detail"><div class="k">배송비 계산값</div><div class="v">'+(shipping>0?fmt(shipping)+'원':'무료/0원')+'</div></div>'+
          '<div class="detail"><div class="k">주문 총액</div><div class="v">'+fmt(order.total_amount)+'원</div></div>'+
          '<div class="detail"><div class="k">상품 종류 수</div><div class="v">'+fmt(items.length)+'개</div></div>'+
        '</div>'+
        '<div class="memo"><div class="k">고객 메모</div><div class="v">'+esc(safeMemoText(memo))+'</div></div>'+
        '<div class="section-title">상품 상세</div>'+
        '<div class="items">'+itemHtml+'</div>'+
        '<div class="total"><span>주문 총액</span><span>'+fmt(order.total_amount)+'원</span></div>'+
      '</section>';

    try{
      await saveViewedOrder(order,items,keep?"보관":"발송",openType);
      const saveEl=$("saveState");
      if(saveEl) saveEl.textContent="✓ 내 주문내역에 저장됨";
      await loadSavedOrders();
    }catch(saveErr){
      const saveEl=$("saveState");
      if(saveEl){
        saveEl.style.color="#a15c00";
        saveEl.textContent="주문 조회는 성공 · 저장은 잠시 실패";
      }
      console.warn("save order failed",saveErr);
    }
  }catch(e){
    $("result").innerHTML='<div class="box err">조회하지 못했어 · '+esc(e.message || e)+'</div>';
  }finally{
    $("lookup").disabled=false;
  }
}

$("lookup").addEventListener("click",lookup);
$("orderNo").addEventListener("keydown",e=>{ if(e.key==="Enter") lookup(); });
$("savedRefresh").addEventListener("click",loadSavedOrders);
$("savedOrders").addEventListener("click",e=>{
  const row=e.target.closest("[data-order-no]");
  if(!row) return;
  $("orderNo").value=row.dataset.orderNo||"";
  lookup();
});

loadSavedOrders();

const qs=new URLSearchParams(location.search).get("order_no");
if(qs){
  $("orderNo").value=qs.toUpperCase();
  lookup();
}
</script>
</body>
</html>
