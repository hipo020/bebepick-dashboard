<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fffaf6" />
  <title>베베픽 재고판</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fffaf6;color:#2d2926;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    .wrap{max-width:760px;margin:auto;padding:20px 14px 90px}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    h1{font-size:24px;margin:0 0 5px}
    .sub,.meta,.summary{color:#8a817b}
    .sub{font-size:13px}
    .shop{text-decoration:none;color:#2d2926;background:#fff;border:1px solid #eee5df;border-radius:12px;padding:10px 12px;font-size:13px}
    .status{margin:14px 0 4px;background:#fff;border:1px solid #eee5df;border-radius:14px;padding:12px 14px;font-size:13px}
    .status.err{background:#fff4f4;border-color:#f0b7b7}
    .controls{position:sticky;top:0;z-index:5;padding:10px 0 12px;background:#fffaf6}
    .searchline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
    .search{width:100%;min-width:0;padding:13px 14px;border:1px solid #eee5df;border-radius:14px;background:#fff;font-size:15px;outline:none}
    .refresh{border-radius:14px!important;padding:0 14px!important;font-weight:700}
    .row{display:flex;gap:7px;overflow:auto;margin-top:9px;padding-bottom:2px}
    .chip,.sort,.refresh{white-space:nowrap;border:1px solid #eee5df;border-radius:999px;padding:9px 12px;background:#fff;color:#2d2926;font:inherit}
    .chip.on{background:#2d2926;color:#fff;border-color:#2d2926}
    .summary{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:0 0 12px}
    .summary b{color:#2d2926}
    .grid{display:grid;gap:10px}
    .card{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid #eee5df;border-radius:16px;padding:10px;box-shadow:0 5px 18px rgba(70,50,35,.06);cursor:pointer}
    .card:active{transform:scale(.995)}
    .rt{font-size:11px;color:#238636;margin-top:5px}.rt.off{color:#a15c00}
    .thumb,.ph{width:82px;height:82px;border-radius:12px;background:#f3eee9}
    .thumb{object-fit:cover}
    .ph{display:grid;place-items:center;font-size:27px}
    .name{font-weight:750;font-size:15px;line-height:1.35;margin-bottom:5px}
    .meta{font-size:12px;line-height:1.55}
    .stock{text-align:right;min-width:65px;font-size:21px;font-weight:800}
    .stock small{display:block;font-size:11px;margin-top:4px}
    .ok{color:#238636}.low{color:#b7791f}.sold{color:#c62828}.hidden{color:#6b7280}
    .empty{padding:50px 10px;text-align:center;color:#8a817b}
    .trend{margin-top:3px}.trend.up{color:#238636}.trend.out{color:#a15c00}
    .history-btn{margin-top:7px;border:1px solid #eee5df;border-radius:9px;background:#fff;padding:6px 9px;color:#655d57;font-size:11px}
    .history-panel{grid-column:1/-1;border-top:1px dashed #eee5df;margin-top:2px;padding:9px 4px 2px;font-size:11px;color:#655d57}
    .history-panel[hidden]{display:none}
    .history-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f5efeb}
    .history-row:last-child{border-bottom:0}.delta-up{color:#238636;font-weight:700}.delta-down{color:#c62828;font-weight:700}
    @media(min-width:650px){
      .grid{grid-template-columns:1fr 1fr}
      .card{grid-template-columns:72px minmax(0,1fr) auto}
      .thumb,.ph{width:72px;height:72px}
    }
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <h1>🧸 베베픽 재고판</h1>
      <div class="sub">실시간 재고 신호 + 1분 안전망</div>
    </div>
    <a class="shop" href="https://bebepick-web.pages.dev/" target="_blank" rel="noopener">베베픽 열기 ↗</a>
  </div>

  <div id="status" class="status"><div id="statusMain">상태 불러오는 중…</div><div id="rtStatus" class="rt off">실시간 연결 준비 중…</div></div>

  <div class="controls">
    <div class="searchline">
      <input id="search" class="search" type="search" placeholder="상품명 검색" />
      <button id="refresh" class="refresh" type="button">새로고침</button>
    </div>
    <div class="row">
      <button class="chip on" data-f="available">판매중</button>
      <button class="chip" data-f="unavailable">품절·판매종료</button>
      <button class="chip" data-f="all">전체</button>
      <button class="chip" data-f="recent_restock">최근 재입고</button>
      <select id="sort" class="sort" aria-label="정렬">
        <option value="asc">재고 적은 순</option>
        <option value="desc">재고 많은 순</option>
        <option value="popular">최근 인기순</option>
        <option value="name">이름순</option>
      </select>
    </div>
  </div>

  <div id="summary" class="summary"></div>
  <div id="grid" class="grid"><div class="empty">재고 불러오는 중…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const EDGE_URL = "https://fergbabqmwnbkkxjvgkj.supabase.co/functions/v1/bebepick-dashboard";
const API_URL = EDGE_URL + "?api=1";
const SHOP_URL = "https://bebepick-web.pages.dev/";
const BEBEPICK_URL = "https://kswhgzweesuwacgqruok.supabase.co";
const BEBEPICK_KEY = "sb_publishable_XSYCZ48RRSxjI24XoR9CUg_-D5ae3KV";
const historyCache = new Map();
const liveSb = window.supabase.createClient(BEBEPICK_URL, BEBEPICK_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});
let realtimeChannel = null;
let liveRefreshTimer = null;
let products = [];
let filter = "available";
let query = "";
let sort = "asc";

const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function time(iso) {
  if (!iso) return "확인 시간 없음";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "확인 시간 없음";
  return new Intl.DateTimeFormat("ko-KR", {
    timeZone: "Asia/Seoul",
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(d);
}

function timeShort(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  return new Intl.DateTimeFormat("ko-KR", {
    timeZone: "Asia/Seoul",
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(d);
}

function durationText(seconds) {
  const s = Number(seconds);
  if (!Number.isFinite(s) || s < 0) return "";
  const mins = Math.round(s / 60);
  if (mins < 60) return mins + "분";
  const hours = Math.floor(mins / 60);
  const rest = mins % 60;
  if (hours < 24) return hours + "시간" + (rest ? " " + rest + "분" : "");
  const days = Math.floor(hours / 24);
  const restHours = hours % 24;
  return days + "일" + (restHours ? " " + restHours + "시간" : "");
}

function label(p) {
  if (p.state === "sold_out") return "품절";
  if (p.state === "hidden") return "숨김/판매종료";
  if (Number(p.current_stock) <= 2) return "재고 얼마 안 남음";
  return "판매중";
}

function stockClass(p) {
  if (p.state === "sold_out") return "sold";
  if (p.state === "hidden") return "hidden";
  return Number(p.current_stock) <= 2 ? "low" : "ok";
}

function liveState(visible, stock) {
  if (Number(visible) !== 1) return "hidden";
  if (Number(stock) <= 0) return "sold_out";
  return "available";
}

async function refreshLiveProducts() {
  try {
    const [dollsRes, shopRes] = await Promise.all([
      liveSb.from("dolls").select("id,name,price,current_stock,fullbox_price,image_url"),
      liveSb.from("shop_products").select("doll_id,visible,image_url")
    ]);
    if (dollsRes.error) throw dollsRes.error;
    if (shopRes.error) throw shopRes.error;

    const shopMap = new Map((shopRes.data || []).map((s) => [Number(s.doll_id), s]));
    const productMap = new Map(products.map((p) => [Number(p.doll_id), p]));
    let changed = false;

    for (const d of (dollsRes.data || [])) {
      const name = String(d.name || "");
      if (/\(풀\)/.test(name)) continue;

      const s = shopMap.get(Number(d.id));
      const visible = Number(s?.visible || 0);
      const stock = Number(d.current_stock || 0);
      const state = liveState(visible, stock);
      const existing = productMap.get(Number(d.id));

      if (existing) {
        Object.assign(existing, {
          name,
          price: Number(d.price || 0),
          fullbox_price: Number(d.fullbox_price || 0),
          current_stock: stock,
          image_url: String(s?.image_url || d.image_url || existing.image_url || ""),
          visible,
          state
        });
        changed = true;
      } else if (state === "available") {
        const added = {
          doll_id: Number(d.id),
          name,
          price: Number(d.price || 0),
          fullbox_price: Number(d.fullbox_price || 0),
          current_stock: stock,
          image_url: String(s?.image_url || d.image_url || ""),
          visible,
          state,
          last_observed_at: null,
          last_event: null,
          last_event_at: null,
          last_stock_change_at: null,
          last_stock_delta: null,
          last_increase_at: null,
          last_increase_qty: null,
          stock_cycle_started_at: null,
          last_sold_out_at: null,
          last_sellout_duration_seconds: null
        };
        products.push(added);
        productMap.set(Number(d.id), added);
        changed = true;
      }
    }

    if (changed) render();
  } catch (e) {
    console.warn("live refresh failed", e);
  }
}

function scheduleLiveRefresh() {
  clearTimeout(liveRefreshTimer);
  liveRefreshTimer = setTimeout(refreshLiveProducts, 250);
}

function startRealtime() {
  if (realtimeChannel) return;

  realtimeChannel = liveSb
    .channel("bebepick-dashboard-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "dolls" }, scheduleLiveRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "shop_products" }, scheduleLiveRefresh)
    .subscribe((status) => {
      const el = $("rtStatus");
      if (!el) return;
      if (status === "SUBSCRIBED") {
        el.className = "rt";
        el.textContent = "⚡ 베베픽 실시간 신호 연결됨";
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        el.className = "rt off";
        el.textContent = "실시간 재연결 중 · 1분 안전망은 계속 작동";
      }
    });
}

function imageHtml(p) {
  if (!p.image_url) return '<div class="ph">🧸</div>';
  const safe = esc(p.image_url);
  return '<img class="thumb" src="' + safe + '" alt="" loading="lazy">';
}

function historyLabel(type) {
  return ({
    baseline: "기록 시작",
    new: "새 상품",
    decrease: "재고 감소",
    increase: "재고 증가",
    restock: "재입고",
    sold_out: "품절",
    hidden: "판매 숨김",
    visible: "재노출",
    state_change: "상태 변경"
  })[type] || type;
}

async function toggleHistory(id) {
  const panel = $("history-" + id);
  if (!panel) return;
  if (!panel.hidden) {
    panel.hidden = true;
    return;
  }
  panel.hidden = false;

  if (historyCache.has(id)) {
    panel.innerHTML = historyCache.get(id);
    return;
  }

  panel.innerHTML = "기록 불러오는 중…";
  try {
    const res = await fetch(EDGE_URL + "?api=history&doll_id=" + encodeURIComponent(id) + "&_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const rows = Array.isArray(data.history) ? data.history : [];
    const html = rows.length ? rows.map((h) => {
      const prev = h.previous_stock == null ? "—" : fmt(h.previous_stock);
      const cur = fmt(h.current_stock);
      const delta = Number(h.delta || 0);
      const deltaHtml = delta > 0
        ? ' <span class="delta-up">+' + fmt(delta) + '</span>'
        : delta < 0
          ? ' <span class="delta-down">' + fmt(delta) + '</span>'
          : "";
      const soldTime = h.sellout_duration_seconds == null
        ? ""
        : " · 입고 후 " + durationText(h.sellout_duration_seconds);
      return '<div class="history-row"><span><b>' + esc(historyLabel(h.change_type)) + '</b> · ' + esc(timeShort(h.observed_at)) + soldTime + '</span><span>' + prev + ' → ' + cur + deltaHtml + '</span></div>';
    }).join("") : "아직 재고 변화 기록이 없어";
    historyCache.set(id, html);
    panel.innerHTML = html;
  } catch (e) {
    panel.innerHTML = "기록을 불러오지 못했어 · " + esc(e.message);
  }
}

function render() {
  const q = query.trim().toLowerCase();

  let list = products.filter((p) => {
    if (filter === "available" && p.state !== "available") return false;
    if (filter === "unavailable" && p.state === "available") return false;
    if (filter === "recent_restock" && !p.recent_restock_24h) return false;
    if (q && !String(p.name || "").toLowerCase().includes(q)) return false;
    return true;
  });

  list.sort((a, b) => {
    if (sort === "name") return String(a.name).localeCompare(String(b.name), "ko");
    if (sort === "desc") return Number(b.current_stock) - Number(a.current_stock);
    if (sort === "popular") {
      const d = Number(b.recent_decrease_60m || 0) - Number(a.recent_decrease_60m || 0);
      if (d !== 0) return d;
      return Number(a.current_stock) - Number(b.current_stock);
    }
    return Number(a.current_stock) - Number(b.current_stock);
  });

  const available = products.filter((p) => p.state === "available").length;
  const sold = products.filter((p) => p.state === "sold_out").length;
  const hidden = products.filter((p) => p.state === "hidden").length;

  $("summary").innerHTML =
    "<span>판매중 <b>" + available + "</b></span>" +
    "<span>품절·판매종료 <b>" + (sold + hidden) + "</b></span>" +
    "<span>표시 <b>" + list.length + "</b></span>";

  if (!list.length) {
    $("grid").innerHTML = '<div class="empty">조건에 맞는 상품이 없어</div>';
    return;
  }

  $("grid").innerHTML = list.map((p) => {
    const price = Number(p.price) > 0 ? fmt(p.price) + "원" : "";
    const full = Number(p.fullbox_price) > 0 ? " · 풀박스 " + fmt(p.fullbox_price) + "원" : "";
    const stock = p.state === "available"
      ? fmt(p.current_stock) + "개"
      : p.state === "sold_out" ? "0개" : "—";
    const recentIncrease = Number(p.last_increase_qty) > 0 && p.last_increase_at
      ? '<div class="meta trend up">최근 입고 +' + fmt(p.last_increase_qty) + ' · ' + esc(timeShort(p.last_increase_at)) + '</div>'
      : "";
    const selloutSpeed = p.last_sellout_duration_seconds != null && p.last_sold_out_at
      ? '<div class="meta trend out">최근 품절까지 ' + esc(durationText(p.last_sellout_duration_seconds)) + '</div>'
      : "";
    const recentDecrease = Number(p.recent_decrease_60m || 0) > 0
      ? '<div class="meta">최근 ' + fmt(p.trend_window_minutes || 60) + '분 재고 -' + fmt(p.recent_decrease_60m) + '개</div>'
      : "";
    const etaMinutes = Number(p.estimated_sellout_minutes);
    const eta = Number.isFinite(etaMinutes) && etaMinutes > 0 && etaMinutes <= 720
      ? '<div class="meta trend out">⏱ 현재 속도면 약 ' + esc(durationText(etaMinutes * 60)) + ' 내 품절 예상</div>'
      : "";

    return '<article class="card">' +
      imageHtml(p) +
      '<div>' +
        '<div class="name">' + esc(p.name) + '</div>' +
        '<div class="meta">' + esc(price + full) + '</div>' +
        '<div class="meta">' + label(p) + '</div>' +
        recentIncrease + recentDecrease + eta + selloutSpeed +
        '<button class="history-btn" type="button" onclick="toggleHistory(' + Number(p.doll_id) + ')">재고 기록</button>' +
      '</div>' +
      '<div class="stock ' + stockClass(p) + '">' +
        stock + '<small>' + label(p) + '</small>' +
      '</div>' +
      '<div id="history-' + Number(p.doll_id) + '" class="history-panel" hidden></div>' +
    '</article>';
  }).join("");

  document.querySelectorAll(".thumb").forEach((img) => {
    img.addEventListener("error", () => {
      img.replaceWith(Object.assign(document.createElement("div"), {
        className: "ph",
        textContent: "🧸"
      }));
    }, { once: true });
  });
}

async function load() {
  try {
    $("refresh").disabled = true;
    const sep = API_URL.includes("?") ? "&" : "?";
    const res = await fetch(API_URL + sep + "_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();
    products = Array.isArray(data.products) ? data.products : [];

    $("status").className = data.last_error ? "status err" : "status";
    $("statusMain").textContent = data.last_error
      ? "⚠️ 감시 오류 · " + data.last_error
      : "💚 정상 감시 중 · 최근 확인 " + time(data.checked_at);

    render();
    await refreshLiveProducts();
  } catch (e) {
    $("status").className = "status err";
    $("statusMain").textContent = "⚠️ 재고를 불러오지 못했어 · " + e.message;
  } finally {
    $("refresh").disabled = false;
  }
}

$("search").addEventListener("input", (e) => {
  query = e.target.value;
  render();
});

$("sort").addEventListener("change", (e) => {
  sort = e.target.value;
  render();
});

document.querySelectorAll(".chip").forEach((button) => {
  button.addEventListener("click", () => {
    filter = button.dataset.f;
    document.querySelectorAll(".chip").forEach((x) => x.classList.remove("on"));
    button.classList.add("on");
    render();
  });
});

$("refresh").addEventListener("click", async () => {
  historyCache.clear();
  await load();
});

$("grid").addEventListener("click", (e) => {
  if (e.target.closest("button")) return;
  const card = e.target.closest(".card");
  if (!card) return;
  window.open(SHOP_URL, "_blank", "noopener");
});

startRealtime();
load();
setInterval(load, 60000);
</script>
</body>
</html>
