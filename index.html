<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fffaf6" />
  <title>베베픽 재고판</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fffaf6;color:#2d2926;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    .wrap{max-width:760px;margin:auto;padding:16px 14px 90px}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    h1{font-size:24px;margin:0 0 5px}
    .sub,.meta,.summary{color:#8a817b}
    .sub{font-size:13px}
    .shop{text-decoration:none;color:#2d2926;background:#fff;border:1px solid #eee5df;border-radius:12px;padding:10px 12px;font-size:13px}
    .main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:13px 0 4px;padding:3px;background:#f1ebe6;border-radius:13px}
    .main-tab{text-align:center;text-decoration:none;color:#786f69;padding:9px 8px;border-radius:10px;font-size:13px;font-weight:750}
    .main-tab.on{background:#fff;color:#2d2926;box-shadow:0 2px 8px rgba(70,50,35,.08)}
    .status{margin:12px 0 2px;background:#fff;border:1px solid #eee5df;border-radius:14px;padding:0;font-size:13px;overflow:hidden}
    .status.err{background:#fff4f4;border-color:#f0b7b7}
    .status-summary{width:100%;min-height:48px;padding:11px 13px;border:0;background:transparent;color:#2d2926;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font:inherit;font-weight:750;cursor:pointer}
    .status-summary:active{background:#faf8f6}
    .status-chevron{font-size:15px;color:#8a817b;transition:transform .18s}
    .status.open .status-chevron{transform:rotate(180deg)}
    .status-details{padding:0 13px 12px;border-top:1px dashed #eee5df}
    .status-details[hidden]{display:none}
    .status-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px}
    .controls{position:sticky;top:0;z-index:5;padding:9px 0 8px;background:rgba(255,250,246,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .searchline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
    .searchbox{position:relative;min-width:0}
    .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.55;pointer-events:none}
    .search{width:100%;min-width:0;padding:13px 40px 13px 38px;border:1px solid #e7ddd6;border-radius:14px;background:#fff;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
    .search:focus{border-color:#b7a79d;box-shadow:0 0 0 3px rgba(120,100,88,.08)}
    .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none;width:30px;height:30px;border:0;border-radius:999px;background:transparent;color:#8a817b;font-size:18px;line-height:1;cursor:pointer}
    .search-clear.show{display:block}
    .refresh{width:46px;height:46px;border-radius:14px!important;padding:0!important;font-weight:800;font-size:20px;line-height:1}
    .filter-row,.option-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
    /* State shortcuts remain visible; do not move 全体/숨김 전체 into a dropdown. */
    .filter-row .chip{min-width:0}
    .option-row{margin-top:7px}
    .option-row[hidden]{display:none!important}
    .filter-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 2px 0;min-height:30px}
    .option-toggle{border:0;background:transparent;color:#655d57;font:inherit;font-size:11.5px;font-weight:750;padding:6px 2px;cursor:pointer;white-space:nowrap}
    .option-toggle .arrow{display:inline-block;margin-left:3px;transition:transform .18s}
    .option-toggle.on .arrow{transform:rotate(180deg)}
    .chip,.special-toggle,.filter-select,.sort,.refresh{white-space:nowrap;border:1px solid #e7ddd6;border-radius:999px;padding:9px 12px;background:#fff;color:#2d2926;font:inherit;min-height:40px;transition:background .15s,border-color .15s,color .15s,transform .08s}
    .chip:active,.special-toggle:active,.refresh:active{transform:scale(.97)}
    .chip.on,.special-toggle.on,.filter-select.on{background:#2d2926;color:#fff;border-color:#2d2926}
    .chip{display:flex;align-items:center;justify-content:center;gap:5px}
    .chip b{font-size:10px;min-width:18px;padding:2px 5px;border-radius:999px;background:#f2ece8;color:#6f655f;font-weight:800}
    .chip.on b{background:rgba(255,255,255,.16);color:#fff}
    .filter-select,.sort{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a817b 50%),linear-gradient(135deg,#8a817b 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat;padding-right:24px}
    .filter-select.on{background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%)}
    .summary{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;margin:0;color:#8a817b}
    .summary b{color:#2d2926}
    .grid{display:grid;gap:10px}
    .card{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid #eee5df;border-radius:16px;padding:10px;box-shadow:0 5px 18px rgba(70,50,35,.06);cursor:pointer}
    .card:active{transform:scale(.995)}
    .rt{font-size:11px;color:#238636;margin:0}.rt.off{color:#a15c00}
    .broadcast-state{font-size:12px;font-weight:750;margin-top:9px;padding-top:9px;border-top:1px dashed #eee5df;line-height:1.45}
    .broadcast-state.live{color:#238636}
    .broadcast-state.off{color:#8a817b}
    .broadcast-state.warn{color:#a15c00}
    .my-queue{font-size:11px;color:#655d57;margin-top:5px;line-height:1.45}
    .status-muted{color:#8a817b;font-weight:500}
    .queue-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .queue-link{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border:1px solid #d7e8dc;border-radius:999px;background:#f4fbf6;color:#237a3b;text-decoration:none;font-size:10.5px;font-weight:750}
    .queue-link:active{transform:scale(.98)}
    .my-queue.on{color:#7a4b00;font-weight:750}
    .my-queue.turn{color:#c62828;font-weight:800}
    .thumb,.ph{width:82px;height:82px;border-radius:12px;background:#f3eee9}
    .thumb{object-fit:cover;cursor:zoom-in}
    .lightbox{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82)}
    .lightbox.open{display:flex}
    .lightbox-inner{position:relative;max-width:min(94vw,900px);max-height:92vh}
    .lightbox-img{display:block;max-width:94vw;max-height:88vh;object-fit:contain;border-radius:14px;background:#fff}
    .lightbox-close{position:absolute;top:-14px;right:-14px;width:38px;height:38px;border:0;border-radius:999px;background:#fff;color:#222;font-size:25px;line-height:38px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25)}
    .ph{display:grid;place-items:center;font-size:27px}
    .name{font-weight:750;font-size:15px;line-height:1.35;margin-bottom:5px}
    .meta{font-size:12px;line-height:1.55}
    .stock{text-align:right;min-width:65px;font-size:21px;font-weight:800}
    .stock small{display:block;font-size:11px;margin-top:4px}
    .ok{color:#238636}.low{color:#b7791f}.sold{color:#c62828}.hidden{color:#6b7280}
    .empty{padding:50px 10px;text-align:center;color:#8a817b}
    .trend{margin-top:3px}.trend.up{color:#238636}.trend.out{color:#a15c00}
    .prep{display:inline-block;margin:0 0 5px;padding:4px 7px;border-radius:999px;background:#fff3cd;color:#7a5a00;font-size:11px;font-weight:750}
    .history-btn{margin-top:7px;border:1px solid #eee5df;border-radius:9px;background:#faf8f6;padding:5px 8px;color:#7a716b;font-size:10.5px}
    .history-panel{grid-column:1/-1;border-top:1px dashed #eee5df;margin-top:2px;padding:9px 4px 2px;font-size:11px;color:#655d57}
    .history-panel[hidden]{display:none}
    .history-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f5efeb}
    .history-row:last-child{border-bottom:0}.delta-up{color:#238636;font-weight:700}.delta-down{color:#c62828;font-weight:700}
    @media(max-width:649px){
      h1{font-size:22px}
      .sub{font-size:12px}
      .shop{padding:9px 10px;font-size:12px}
      .filter-row,.option-row{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:7px;
        overflow:visible;
      }
      .chip,.special-toggle,.filter-select,.sort{
        width:100%;
        min-width:0;
        padding:9px 6px;
        font-size:12px;
        text-align:center;
      }
      .filter-select,.sort{
        text-overflow:ellipsis;
      }
    }
    @media(min-width:650px){
      .grid{grid-template-columns:1fr 1fr}
      .card{grid-template-columns:72px minmax(0,1fr) auto}
      .thumb,.ph{width:72px;height:72px}
    }
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <h1>🧸 베베픽 재고판</h1>
      <div class="sub">실시간 재고 신호 + 1분 안전망</div>
    </div>
    <a class="shop" href="https://bebepick-web.pages.dev/" target="_blank" rel="noopener">베베픽 열기 ↗</a>
  </div>

  <nav class="main-tabs" aria-label="베베픽 도구">
    <a class="main-tab on" href="./">🧸 재고표</a>
    <a class="main-tab" href="./order.html">📦 주문옵션 조회</a>
  </nav>

  <div id="status" class="status">
    <button id="statusToggle" class="status-summary" type="button" aria-expanded="false">
      <span id="statusCompact">상태 확인 중…</span>
      <span class="status-chevron">⌄</span>
    </button>
    <div id="statusDetails" class="status-details" hidden>
      <div class="status-top">
        <div id="statusMain">상태 불러오는 중…</div>
        <div id="rtStatus" class="rt off">실시간 준비 중…</div>
      </div>
      <div id="broadcastState" class="broadcast-state off">🎥 방송 상태 확인 중…</div>
      <div id="myQueueState" class="my-queue">👤 내 대기 확인 중…</div>
    </div>
  </div>

  <div class="controls">
    <div class="searchline">
      <div class="searchbox">
        <span class="search-icon">⌕</span>
        <input id="search" class="search" type="search" placeholder="상품명 검색" autocomplete="off" />
        <button id="searchClear" class="search-clear" type="button" aria-label="검색어 지우기">×</button>
      </div>
      <button id="refresh" class="refresh" type="button" aria-label="새로고침" title="새로고침">↻</button>
    </div>

    <div class="filter-row" aria-label="상품 상태 바로가기">
      <button class="chip on" data-f="available" aria-pressed="true"><span>판매중</span><b id="countAvailable">0</b></button>
      <button class="chip" data-f="all" aria-pressed="false"><span>전체</span><b id="countAll">0</b></button>
      <button class="chip" data-f="hidden" aria-pressed="false" aria-label="숨겨진 모든 제품"><span>숨김 전체</span><b id="countHidden">0</b></button>
      <button class="chip" data-f="hidden_stock" aria-pressed="false"><span>숨김·재고</span><b id="countHiddenStock">0</b></button>
      <button class="chip" data-f="unavailable" aria-pressed="false"><span>품절·종료</span><b id="countUnavailable">0</b></button>
      <button class="chip" data-f="upcoming" aria-pressed="false"><span>👀 신상추정</span><b id="countUpcoming">0</b></button>
    </div>

    <div class="filter-tools">
      <div id="summary" class="summary"></div>
      <button id="optionToggle" class="option-toggle" type="button" aria-expanded="false">
        필터·정렬 <span class="arrow">⌄</span>
      </button>
    </div>

    <div id="optionRow" class="option-row" hidden>
      <select id="filterSelect" class="filter-select" aria-label="기타 필터">
        <option value="">기타 필터</option>
        <option value="recent_restock">최근 재입고</option>
      </select>

      <button id="specialToggle" class="special-toggle" type="button" aria-pressed="false">특수상품</button>

      <select id="sort" class="sort" aria-label="정렬">
        <option value="desc">재고 많은 순</option>
        <option value="asc">재고 적은 순</option>
        <option value="popular">최근 인기순</option>
        <option value="name">이름순</option>
      </select>
    </div>
  </div>
  <div id="grid" class="grid"><div class="empty">재고 불러오는 중…</div></div>
</main>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <div class="lightbox-inner">
    <button id="lightboxClose" class="lightbox-close" type="button" aria-label="이미지 닫기">×</button>
    <img id="lightboxImg" class="lightbox-img" alt="">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const EDGE_URL = "https://fergbabqmwnbkkxjvgkj.supabase.co/functions/v1/bebepick-dashboard";
const API_URL = EDGE_URL + "?api=1";
const SHOP_URL = "https://bebepick-web.pages.dev/";
const BEBEPICK_URL = "https://kswhgzweesuwacgqruok.supabase.co";
const BEBEPICK_KEY = "sb_publishable_XSYCZ48RRSxjI24XoR9CUg_-D5ae3KV";
const QUEUE_NICKNAME = "leo-s8v2z";
const historyCache = new Map();
const liveSb = window.supabase.createClient(BEBEPICK_URL, BEBEPICK_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});
let realtimeChannel = null;
let liveRefreshTimer = null;
let statsHydratedAt = 0;
let products = [];
let filter = "available";
let query = "";
let sort = "desc";
let includeSpecial = false;
let optionPanelOpen = false;

const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");
// Search only: ignore whitespace in both the typed query and the saved name.
// Keep the original product name and the displayed inventory untouched.
const normalizeSearch = (value) => String(value ?? "")
  .replace(/\s+/g, "")
  .toLocaleLowerCase("ko");

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function time(iso) {
  if (!iso) return "확인 시간 없음";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "확인 시간 없음";
  return new Intl.DateTimeFormat("ko-KR", {
    timeZone: "Asia/Seoul",
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(d);
}

function timeShort(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  return new Intl.DateTimeFormat("ko-KR", {
    timeZone: "Asia/Seoul",
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(d);
}

function durationText(seconds) {
  const s = Number(seconds);
  if (!Number.isFinite(s) || s < 0) return "";
  const mins = Math.round(s / 60);
  if (mins < 60) return mins + "분";
  const hours = Math.floor(mins / 60);
  const rest = mins % 60;
  if (hours < 24) return hours + "시간" + (rest ? " " + rest + "분" : "");
  const days = Math.floor(hours / 24);
  const restHours = hours % 24;
  return days + "일" + (restHours ? " " + restHours + "시간" : "");
}

function label(p) {
  if (p.state === "sold_out") return "품절";
  if (p.state === "hidden") return "숨김/판매종료";
  if (Number(p.current_stock) <= 2) return "재고 얼마 안 남음";
  return "판매중";
}

function stockClass(p) {
  if (p.state === "sold_out") return "sold";
  if (p.state === "hidden") return "hidden";
  return Number(p.current_stock) <= 2 ? "low" : "ok";
}

function liveState(visible, stock) {
  if (Number(visible) !== 1) return "hidden";
  if (Number(stock) <= 0) return "sold_out";
  return "available";
}

async function refreshLiveProducts() {
  try {
    const [dollsRes, shopRes] = await Promise.all([
      liveSb.from("dolls").select("id,name,price,current_stock,fullbox_price,pack_size,is_new,created_at,image_url"),
      liveSb.from("shop_products").select("doll_id,visible,image_url")
    ]);
    if (dollsRes.error) throw dollsRes.error;
    if (shopRes.error) throw shopRes.error;

    const shopMap = new Map((shopRes.data || []).map((s) => [Number(s.doll_id), s]));
    const productMap = new Map(products.map((p) => [Number(p.doll_id), p]));
    let changed = false;

    for (const d of (dollsRes.data || [])) {
      const name = String(d.name || "");
      if (/\(풀\)/.test(name)) continue;

      const s = shopMap.get(Number(d.id));
      const visible = Number(s?.visible || 0);
      const stock = Number(d.current_stock || 0);
      const state = liveState(visible, stock);
      const existing = productMap.get(Number(d.id));

      if (existing) {
        Object.assign(existing, {
          name,
          price: Number(d.price || 0),
          fullbox_price: Number(d.fullbox_price || 0),
          pack_size: Number(d.pack_size || existing.pack_size || 1),
          is_new: Number(d.is_new || 0),
          source_created_at: d.created_at || existing.source_created_at || null,
          current_stock: stock,
          image_url: String(s?.image_url || d.image_url || existing.image_url || ""),
          visible,
          state
        });
        changed = true;
      } else {
        const added = {
          doll_id: Number(d.id),
          name,
          price: Number(d.price || 0),
          fullbox_price: Number(d.fullbox_price || 0),
          pack_size: Number(d.pack_size || 1),
          is_new: Number(d.is_new || 0),
          source_created_at: d.created_at || null,
          current_stock: stock,
          image_url: String(s?.image_url || d.image_url || ""),
          visible,
          state,
          last_observed_at: null,
          last_event: null,
          last_event_at: null,
          last_stock_change_at: null,
          last_stock_delta: null,
          last_increase_at: null,
          last_increase_qty: null,
          stock_cycle_started_at: null,
          last_sold_out_at: null,
          last_sellout_duration_seconds: null
        };
        products.push(added);
        productMap.set(Number(d.id), added);
        changed = true;
      }
    }

    if (changed) render();
  } catch (e) {
    console.warn("live refresh failed", e);
  }
}

function scheduleLiveRefresh() {
  clearTimeout(liveRefreshTimer);
  liveRefreshTimer = setTimeout(refreshLiveProducts, 250);
}

function broadcastLabel(slug) {
  return ({
    bebepick: "베베픽",
    bebepick_plus: "베베픽 플러스",
    test_be: "테스트",
    pickandfun: "픽앤펀",
    pickandfun_plus: "픽앤펀 플러스"
  })[String(slug || "")] || String(slug || "방송");
}

function queuePageUrl(slug) {
  return ({
    bebepick: SHOP_URL + "bebepick_que",
    bebepick_plus: SHOP_URL + "bebepick_plus_que",
    test_be: SHOP_URL + "test_be_que",
    pickandfun: SHOP_URL + "pickandfun_que",
    pickandfun_plus: SHOP_URL + "pickandfun_plus_que"
  })[String(slug || "")] || (SHOP_URL + encodeURIComponent(String(slug || "")) + "_que");
}

function updateStatusCompact() {
  const compact = $("statusCompact");
  if (!compact) return;

  const parts = [];
  const status = $("status");
  const rt = $("rtStatus");
  const broadcast = $("broadcastState");
  const mine = $("myQueueState");

  if (status?.classList.contains("err")) {
    parts.push("⚠️ 감시 오류");
  } else if (rt && !rt.classList.contains("off")) {
    parts.push("💚 실시간");
  } else {
    parts.push("💚 감시중");
  }

  if (broadcast?.classList.contains("live")) parts.push("🎥 방송중");
  else if (broadcast?.classList.contains("off")) parts.push("🌙 방송없음");

  const mineText = String(mine?.textContent || "").replace(/\s+/g, " ").trim();
  if (mineText.includes("지금 내 차례")) {
    parts.push("👤 내 차례");
  } else if (mineText.includes("순서 지나감")) {
    parts.push("👤 순서 지나감");
  } else {
    const m = mineText.match(/(\d+번째 · 앞 \d+명(?: · 약 \d+분)?)/);
    if (m) parts.push("👤 " + m[1]);
  }

  compact.textContent = parts.join(" · ");
}

async function refreshBroadcastState() {
  const el = $("broadcastState");
  const mine = $("myQueueState");
  if (!el) return;

  try {
    const [queueRes, etaRes] = await Promise.all([
      liveSb
        .from("broadcast_queue")
        .select("broadcast_id,broadcast_name,channel_slug,status,current_idx,queue_data")
        .eq("status", "active")
        .order("broadcast_id"),
      fetch(EDGE_URL + "?api=queue&_=" + Date.now(), { cache: "no-store" })
        .then((res) => res.ok ? res.json() : ({ broadcasts: [] }))
        .catch(() => ({ broadcasts: [] }))
    ]);

    if (queueRes.error) throw queueRes.error;

    const rows = Array.isArray(queueRes.data) ? queueRes.data : [];
    const etaMap = new Map(
      (Array.isArray(etaRes?.broadcasts) ? etaRes.broadcasts : []).map((x) => [
        Number(x.broadcast_id) + ":" + String(x.channel_slug || ""),
        x
      ])
    );
    if (!rows.length) {
      el.className = "broadcast-state off";
      el.textContent = "🌙 방송 없음 · 주문번호 생성 불가";
      if (mine) {
        mine.className = "my-queue";
        mine.textContent = "👤 내 대기 없음";
      }
      updateStatusCompact();
      return;
    }

    const links = rows.map((row) => {
      const channel = broadcastLabel(row.channel_slug);
      const rawName = String(row.broadcast_name || "").trim();
      let shortName = rawName
        .replace(/^\d{8}_/, "")
        .replace(/^베플/, "베플 ")
        .replace(/^베베픽/, "베베픽 ");
      const label = shortName || channel;
      return '<a class="queue-link" href="' + esc(queuePageUrl(row.channel_slug)) +
        '" target="_blank" rel="noopener">📋 ' + esc(label) + ' 순서표 ↗</a>';
    });

    el.className = "broadcast-state live";
    el.innerHTML =
      "🎥 방송중 · 주문번호 생성 가능" +
      '<div class="queue-links">' + links.join("") + "</div>";

    if (mine) {
      const target = String(QUEUE_NICKNAME || "").trim().toLowerCase();
      const mineRows = [];

      for (const row of rows) {
        let queue = row.queue_data;
        if (typeof queue === "string") {
          try { queue = JSON.parse(queue); } catch { queue = []; }
        }
        if (!Array.isArray(queue)) continue;

        const currentIdx = Number(row.current_idx ?? -1);
        const positions = queue
          .map((entry, index) =>
            String(entry?.nickname || "").trim().toLowerCase() === target ? index : -1
          )
          .filter((index) => index >= 0);

        if (!positions.length) continue;

        const future = positions.filter((index) => index >= currentIdx);
        const position = future.length ? Math.min(...future) : Math.max(...positions);
        const ahead = position - currentIdx;
        const eta = etaMap.get(
          Number(row.broadcast_id) + ":" + String(row.channel_slug || "")
        );
        mineRows.push({
          channel: broadcastLabel(row.channel_slug),
          position,
          ahead,
          etaMinutes: Number.isFinite(Number(eta?.estimated_wait_minutes))
            ? Number(eta.estimated_wait_minutes)
            : null
        });
      }

      if (!mineRows.length) {
        mine.className = "my-queue";
        mine.textContent = "👤 내 대기 없음";
      } else {
        mine.className = mineRows.some((x) => x.ahead === 0)
          ? "my-queue turn"
          : "my-queue on";
        const lines = mineRows.map((x) => {
          if (x.ahead === 0) return "👤 " + x.channel + " · 지금 내 차례";
          if (x.ahead < 0) return "👤 " + x.channel + " · 순서 지나감";
          const etaText = x.etaMinutes !== null && x.etaMinutes > 0
            ? " · 약 " + x.etaMinutes + "분"
            : "";
          return "👤 " + x.channel + " · " + (x.position + 1) + "번째 · 앞 " + x.ahead + "명" + etaText;
        });
        const needsEta = mineRows.some((x) => x.ahead > 0 && !(x.etaMinutes !== null && x.etaMinutes > 0));
        mine.innerHTML = lines.map(esc).join("<br>") +
          (needsEta ? '<br><span class="status-muted">⏱ 예상시간 계산 중</span>' : "");
      }
    }
    updateStatusCompact();
  } catch (e) {
    el.className = "broadcast-state warn";
    el.textContent = "⚠️ 방송 상태 확인 실패";
    if (mine) {
      mine.className = "my-queue";
      mine.textContent = "👤 내 대기 확인 실패";
    }
    updateStatusCompact();
  }
}

function startRealtime() {
  if (realtimeChannel) return;

  realtimeChannel = liveSb
    .channel("bebepick-dashboard-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "dolls" }, scheduleLiveRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "shop_products" }, scheduleLiveRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "broadcast_queue" }, refreshBroadcastState)
    .subscribe((status) => {
      const el = $("rtStatus");
      if (!el) return;
      if (status === "SUBSCRIBED") {
        el.className = "rt";
        el.textContent = "⚡ 실시간";
        updateStatusCompact();
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        el.className = "rt off";
        el.textContent = "실시간 재연결 중";
        updateStatusCompact();
      }
    });
}

function isRecentRestock(p) {
  if (!p.last_increase_at) return false;
  const t = new Date(p.last_increase_at).getTime();
  return Number.isFinite(t) && Date.now() - t <= 24 * 60 * 60 * 1000;
}

function isUpcomingCandidate(p) {
  if (p.state !== "hidden" || Number(p.current_stock) <= 0) return false;
  if (p.hidden_recent_with_stock === true) return true;
  const t = p.source_created_at ? new Date(p.source_created_at).getTime() : NaN;
  return Number.isFinite(t) && Date.now() - t <= 72 * 60 * 60 * 1000;
}

function isSpecialProduct(p) {
  return /●/.test(String(p?.name || ""));
}

function applyHistoryStats(p, rows) {
  const now = Date.now();
  const hourAgo = now - 60 * 60 * 1000;
  const increaseMs = p.last_increase_at ? new Date(p.last_increase_at).getTime() : 0;
  const startMs = Math.max(hourAgo, Number.isFinite(increaseMs) ? increaseMs : 0);
  const relevant = (rows || []).filter((h) => {
    const t = new Date(h.observed_at).getTime();
    return Number.isFinite(t) && t >= startMs;
  });

  const decrease = relevant.reduce((sum, h) => {
    const d = Number(h.delta || 0);
    return d < 0 ? sum + Math.abs(d) : sum;
  }, 0);
  const mins = Math.max(5, Math.min(60, Math.round((now - startMs) / 60000)));
  const rate = decrease > 0 ? decrease / mins : 0;

  p.recent_decrease_60m = decrease;
  p.trend_window_minutes = mins;
  p.recent_restock_24h = isRecentRestock(p);
  p.estimated_sellout_minutes =
    p.state === "available" &&
    Number(p.current_stock) > 0 &&
    decrease >= 2 &&
    rate > 0
      ? Math.max(1, Math.round(Number(p.current_stock) / rate))
      : null;
}

async function hydrateClientStats(force = false) {
  const backendHasStats = products.some((p) => p.recent_decrease_60m !== undefined);
  if (backendHasStats && !force) {
    updateStatusCompact();

    products.forEach((p) => {
      p.recent_restock_24h = p.recent_restock_24h ?? isRecentRestock(p);
    });
    return;
  }

  if (!force && Date.now() - statsHydratedAt < 5 * 60 * 1000) return;
  statsHydratedAt = Date.now();

  const list = [...products];
  for (let i = 0; i < list.length; i += 6) {
    const batch = list.slice(i, i + 6);
    await Promise.all(batch.map(async (p) => {
      try {
        const res = await fetch(
          EDGE_URL + "?api=history&doll_id=" + encodeURIComponent(p.doll_id) + "&_=" + Date.now(),
          { cache: "no-store" }
        );
        if (!res.ok) return;
        const data = await res.json();
        applyHistoryStats(p, Array.isArray(data.history) ? data.history : []);
      } catch {}
    }));
  }
  render();
}

function imageHtml(p) {
  if (!p.image_url) return '<div class="ph">🧸</div>';
  const safe = esc(p.image_url);
  return '<img class="thumb" src="' + safe + '" alt="' + esc(p.name || "") + '" loading="lazy" data-zoom-src="' + safe + '" title="이미지 크게 보기">';
}

function openLightbox(src, alt = "") {
  const box = $("lightbox");
  const img = $("lightboxImg");
  if (!box || !img || !src) return;
  img.src = src;
  img.alt = alt;
  box.classList.add("open");
  box.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  const box = $("lightbox");
  const img = $("lightboxImg");
  if (!box || !img) return;
  box.classList.remove("open");
  box.setAttribute("aria-hidden", "true");
  img.src = "";
  document.body.style.overflow = "";
}

function historyLabel(type) {
  return ({
    baseline: "기록 시작",
    new: "새 상품",
    decrease: "재고 감소",
    increase: "재고 증가",
    restock: "재입고",
    sold_out: "품절",
    hidden: "판매 숨김",
    visible: "재노출",
    state_change: "상태 변경"
  })[type] || type;
}

async function toggleHistory(id) {
  const panel = $("history-" + id);
  if (!panel) return;
  if (!panel.hidden) {
    panel.hidden = true;
    return;
  }
  panel.hidden = false;

  if (historyCache.has(id)) {
    panel.innerHTML = historyCache.get(id);
    return;
  }

  panel.innerHTML = "기록 불러오는 중…";
  try {
    const res = await fetch(EDGE_URL + "?api=history&doll_id=" + encodeURIComponent(id) + "&_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const rows = Array.isArray(data.history) ? data.history : [];
    const html = rows.length ? rows.map((h) => {
      const prev = h.previous_stock == null ? "—" : fmt(h.previous_stock);
      const cur = fmt(h.current_stock);
      const delta = Number(h.delta || 0);
      const deltaHtml = delta > 0
        ? ' <span class="delta-up">+' + fmt(delta) + '</span>'
        : delta < 0
          ? ' <span class="delta-down">' + fmt(delta) + '</span>'
          : "";
      const soldTime = h.sellout_duration_seconds == null
        ? ""
        : " · 입고 후 " + durationText(h.sellout_duration_seconds);
      return '<div class="history-row"><span><b>' + esc(historyLabel(h.change_type)) + '</b> · ' + esc(timeShort(h.observed_at)) + soldTime + '</span><span>' + prev + ' → ' + cur + deltaHtml + '</span></div>';
    }).join("") : "아직 재고 변화 기록이 없어";
    historyCache.set(id, html);
    panel.innerHTML = html;
  } catch (e) {
    panel.innerHTML = "기록을 불러오지 못했어 · " + esc(e.message);
  }
}

function syncFilterUI() {
  const quickFilters = new Set(["available", "all", "hidden", "hidden_stock", "unavailable", "upcoming"]);
  document.querySelectorAll(".chip").forEach((button) => {
    const on = button.dataset.f === filter;
    button.classList.toggle("on", on);
    button.setAttribute("aria-pressed", on ? "true" : "false");
  });

  const fs = $("filterSelect");
  if (fs) {
    fs.value = quickFilters.has(filter) ? "" : filter;
    fs.classList.toggle("on", !quickFilters.has(filter) && Boolean(filter));
  }
}

function syncSearchClear() {
  const btn = $("searchClear");
  if (btn) btn.classList.toggle("show", Boolean(query.trim()));
}

function render() {
  const q = normalizeSearch(query);

  const baseProducts = includeSpecial
    ? products
    : products.filter((p) => !isSpecialProduct(p));

  let list = baseProducts.filter((p) => {
    if (filter === "available" && p.state !== "available") return false;
    if (filter === "unavailable" && p.state === "available") return false;
    if (filter === "hidden" && p.state !== "hidden") return false;
    if (filter === "hidden_stock" && !(p.state === "hidden" && Number(p.current_stock) > 0)) return false;
    if (filter === "upcoming" && !isUpcomingCandidate(p)) return false;
    if (filter === "recent_restock" && !(p.recent_restock_24h ?? isRecentRestock(p))) return false;
    if (q && !normalizeSearch(p.name).includes(q)) return false;
    return true;
  });

  list.sort((a, b) => {
    if (sort === "name") return String(a.name).localeCompare(String(b.name), "ko");
    if (sort === "desc") return Number(b.current_stock) - Number(a.current_stock);
    if (sort === "popular") {
      const d = Number(b.recent_decrease_60m || 0) - Number(a.recent_decrease_60m || 0);
      if (d !== 0) return d;
      return Number(a.current_stock) - Number(b.current_stock);
    }
    return Number(a.current_stock) - Number(b.current_stock);
  });

  const available = baseProducts.filter((p) => p.state === "available").length;
  const hidden = baseProducts.filter((p) => p.state === "hidden").length;
  const unavailable = baseProducts.filter((p) => p.state !== "available").length;
  const hiddenStock = baseProducts.filter(
    (p) => p.state === "hidden" && Number(p.current_stock) > 0
  ).length;
  const upcoming = baseProducts.filter((p) => isUpcomingCandidate(p)).length;

  if ($("countAvailable")) $("countAvailable").textContent = fmt(available);
  if ($("countAll")) $("countAll").textContent = fmt(baseProducts.length);
  if ($("countHidden")) $("countHidden").textContent = fmt(hidden);
  if ($("countUnavailable")) $("countUnavailable").textContent = fmt(unavailable);
  if ($("countHiddenStock")) $("countHiddenStock").textContent = fmt(hiddenStock);
  if ($("countUpcoming")) $("countUpcoming").textContent = fmt(upcoming);
  syncFilterUI();
  syncSearchClear();

  const filterLabel = ({
    available: "판매중",
    hidden_stock: "숨김·재고",
    upcoming: "신상추정",
    unavailable: "품절·판매종료",
    hidden: "숨김 전체",
    recent_restock: "최근 재입고",
    all: "전체"
  })[filter] || "현재";
  $("summary").innerHTML =
    "<span>" + esc(filterLabel) + " <b>" + list.length + "</b>개</span>" +
    (q ? "<span>·</span><span>검색 결과</span>" : "");

  if (!list.length) {
    $("grid").innerHTML = '<div class="empty">조건에 맞는 상품이 없어</div>';
    return;
  }

  $("grid").innerHTML = list.map((p) => {
    const price = Number(p.price) > 0 ? fmt(p.price) + "원" : "";
    const pack = Number(p.pack_size) > 1 ? " · " + fmt(p.pack_size) + "입" : "";
    const full = Number(p.fullbox_price) > 0 ? " · 풀박스 " + fmt(p.fullbox_price) + "원" : "";
    const stock = p.state === "available"
      ? fmt(p.current_stock) + "개"
      : p.state === "sold_out"
        ? "0개"
        : Number.isFinite(Number(p.current_stock))
          ? fmt(p.current_stock) + "개"
          : "—";
    const recentIncrease = Number(p.last_increase_qty) > 0 && p.last_increase_at
      ? '<div class="meta trend up">최근 입고 +' + fmt(p.last_increase_qty) + ' · ' + esc(timeShort(p.last_increase_at)) + '</div>'
      : "";
    const selloutSpeed = p.last_sellout_duration_seconds != null && p.last_sold_out_at
      ? '<div class="meta trend out">최근 품절까지 ' + esc(durationText(p.last_sellout_duration_seconds)) + '</div>'
      : "";
    const recentDecrease = Number(p.recent_decrease_60m || 0) > 0
      ? '<div class="meta">최근 ' + fmt(p.trend_window_minutes || 60) + '분 재고 -' + fmt(p.recent_decrease_60m) + '개</div>'
      : "";
    const prepBadge = isUpcomingCandidate(p)
      ? '<div class="prep">👀 미공개 신상추정 · 최근 등록</div>'
      : "";
    const etaMinutes = Number(p.estimated_sellout_minutes);
    const eta = Number.isFinite(etaMinutes) && etaMinutes > 0 && etaMinutes <= 720
      ? '<div class="meta trend out">⏱ 현재 속도면 약 ' + esc(durationText(etaMinutes * 60)) + ' 내 품절 예상</div>'
      : "";

    return '<article class="card">' +
      imageHtml(p) +
      '<div>' +
        prepBadge +
        '<div class="name">' + esc(p.name) + '</div>' +
        '<div class="meta">' + esc(price + pack + full) + '</div>' +
        recentIncrease + recentDecrease + eta + selloutSpeed +
        '<button class="history-btn" type="button" onclick="toggleHistory(' + Number(p.doll_id) + ')">재고 기록</button>' +
      '</div>' +
      '<div class="stock ' + stockClass(p) + '">' +
        stock + '<small>' + label(p) + '</small>' +
      '</div>' +
      '<div id="history-' + Number(p.doll_id) + '" class="history-panel" hidden></div>' +
    '</article>';
  }).join("");

  document.querySelectorAll(".thumb").forEach((img) => {
    img.addEventListener("error", () => {
      img.replaceWith(Object.assign(document.createElement("div"), {
        className: "ph",
        textContent: "🧸"
      }));
    }, { once: true });
  });
}

async function load() {
  try {
    $("refresh").disabled = true;
    $("refresh").textContent = "…";
    const sep = API_URL.includes("?") ? "&" : "?";
    const res = await fetch(API_URL + sep + "_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();
    products = Array.isArray(data.products) ? data.products : [];

    $("status").className = data.last_error ? "status err" : "status";
    $("statusMain").textContent = data.last_error
      ? "⚠️ 감시 오류 · " + data.last_error
      : "💚 정상 감시 중 · " + time(data.checked_at);

    products.forEach((p) => {
      p.recent_restock_24h = p.recent_restock_24h ?? isRecentRestock(p);
    });
    render();
    await Promise.all([
      refreshLiveProducts(),
      refreshBroadcastState()
    ]);
    await hydrateClientStats();
  } catch (e) {
    $("status").className = "status err";
    $("statusMain").textContent = "⚠️ 재고를 불러오지 못했어 · " + e.message;
    updateStatusCompact();
  } finally {
    $("refresh").disabled = false;
    $("refresh").textContent = "↻";
  }
}

$("statusToggle").addEventListener("click", () => {
  const status = $("status");
  const details = $("statusDetails");
  const btn = $("statusToggle");
  const open = details.hasAttribute("hidden");
  if (open) details.removeAttribute("hidden");
  else details.setAttribute("hidden", "");
  status.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", open ? "true" : "false");
});

$("optionToggle").addEventListener("click", () => {
  optionPanelOpen = !optionPanelOpen;
  const row = $("optionRow");
  const btn = $("optionToggle");
  if (optionPanelOpen) row.removeAttribute("hidden");
  else row.setAttribute("hidden", "");
  btn.classList.toggle("on", optionPanelOpen);
  btn.setAttribute("aria-expanded", optionPanelOpen ? "true" : "false");
});

$("search").addEventListener("input", (e) => {
  query = e.target.value;
  syncSearchClear();
  render();
});

$("searchClear").addEventListener("click", () => {
  query = "";
  $("search").value = "";
  syncSearchClear();
  $("search").focus();
  render();
});

$("sort").addEventListener("change", (e) => {
  sort = e.target.value;
  render();
});

$("filterSelect").addEventListener("change", (e) => {
  const value = e.target.value;
  if (!value) return;
  filter = value;
  syncFilterUI();
  render();
});

$("specialToggle").addEventListener("click", () => {
  includeSpecial = !includeSpecial;
  const btn = $("specialToggle");
  btn.classList.toggle("on", includeSpecial);
  btn.setAttribute("aria-pressed", includeSpecial ? "true" : "false");
  btn.textContent = includeSpecial ? "특수상품 ON" : "특수상품";
  render();
});


document.querySelectorAll(".chip").forEach((button) => {
  button.addEventListener("click", () => {
    filter = button.dataset.f;
    syncFilterUI();
    render();
  });
});

$("refresh").addEventListener("click", async () => {
  historyCache.clear();
  statsHydratedAt = 0;
  await load();
  await hydrateClientStats(true);
});

$("grid").addEventListener("click", (e) => {
  const zoomImg = e.target.closest("[data-zoom-src]");
  if (zoomImg) {
    e.stopPropagation();
    openLightbox(zoomImg.dataset.zoomSrc, zoomImg.alt || "");
    return;
  }
  if (e.target.closest("button")) return;
  const card = e.target.closest(".card");
  if (!card) return;
  window.open(SHOP_URL, "_blank", "noopener");
});

$("lightboxClose").addEventListener("click", closeLightbox);
$("lightbox").addEventListener("click", (e) => {
  if (e.target === $("lightbox")) closeLightbox();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLightbox();
});

startRealtime();
load();
setInterval(load, 60000);
</script>
