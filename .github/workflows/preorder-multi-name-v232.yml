name: Multi-name Candidate Safe Diagnostic v2.3.2
on:
  push:
    branches: [main]
    paths:
      - 'bebepick-quick-order-preorder-test-v232.js'
      - 'bebepick-preorder-names-v232-install.html'
      - 'tests/quick-order-presubmit-v232-names.test.mjs'
      - '.github/workflows/preorder-multi-name-v232.yml'
  pull_request:
    paths:
      - 'bebepick-quick-order-preorder-test-v232.js'
      - 'bebepick-preorder-names-v232-install.html'
      - 'tests/quick-order-presubmit-v232-names.test.mjs'
      - '.github/workflows/preorder-multi-name-v232.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify multiple names, no-submit, previous v2.3.1 and live v2.3
        run: node --test tests/quick-order-presubmit-v232-names.test.mjs tests/quick-order-presubmit-v231.test.mjs tests/general-fast-order-v23-multi.test.mjs
