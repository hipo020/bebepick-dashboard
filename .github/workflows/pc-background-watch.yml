name: PC Background Watch Safety
on:
  push:
    paths:
      - 'chrome-background-watch/**'
      - 'bebepick-quick-order-general-v24.js'
      - 'tests/chrome-background-watch.test.cjs'
      - '.github/workflows/pc-background-watch.yml'
  pull_request:
    paths:
      - 'chrome-background-watch/**'
      - 'bebepick-quick-order-general-v24.js'
      - 'tests/chrome-background-watch.test.cjs'
      - '.github/workflows/pc-background-watch.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extension unit and syntax tests
        run: node --test tests/chrome-background-watch.test.cjs
      - name: Existing v2.4 regression tests
        run: node --test tests/general-fast-order-v24-names.test.mjs
