name: PC Background Watch Safety
on:
  push:
    paths:
      - 'chrome-background-watch/**'
      - 'bebepick-quick-order-general-v24.js'
      - 'tests/chrome-background-watch.test.cjs'
      - 'tests/general-v24-mobile-mode-visibility.test.cjs'
      - 'tests/general-v24-quantity-total.test.cjs'
      - '.github/workflows/pc-background-watch.yml'
  pull_request:
    paths:
      - 'chrome-background-watch/**'
      - 'bebepick-quick-order-general-v24.js'
      - 'tests/chrome-background-watch.test.cjs'
      - 'tests/general-v24-mobile-mode-visibility.test.cjs'
      - 'tests/general-v24-quantity-total.test.cjs'
      - '.github/workflows/pc-background-watch.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extension unit and syntax tests
        run: node --test tests/chrome-background-watch.test.cjs
      - name: Existing v2.4 regression tests
        run: node --test tests/general-fast-order-v24-names.test.mjs
      - name: Mobile bookmarklet UX and basket preservation tests
        run: node --test tests/general-v24-mobile-mode-visibility.test.cjs
      - name: Saved-quantity and cart-total tests
        run: node --test tests/general-v24-quantity-total.test.cjs
      - name: Package Chrome extension
        run: cd chrome-background-watch && zip -q -9 ../bebepick-pc-background-watch-v01.zip manifest.json background.js bridge.js checks.js README.md
      - uses: actions/upload-artifact@v4
        with:
          name: bebepick-pc-background-watch-v01
          path: bebepick-pc-background-watch-v01.zip
          retention-days: 30
