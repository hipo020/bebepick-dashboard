name: Actual Quick Order v2.4 Multi-name Safety
on:
  push:
    branches: [main]
    paths:
      - 'bebepick-quick-order-general-v24.js'
      - 'index.html'
      - 'tests/upcoming-restock-threshold.test.cjs'
      - 'tests/catalog-unavailable-frontend.test.cjs'
      - 'tests/new-site-candidate-v2.test.cjs'
      - 'tests/public-archived-prices-ui.test.cjs'
      - 'tests/chrome-member-price-auto.test.cjs'
      - 'bebepick-chrome-member-auto-prices.js'
      - 'bebepick-chrome-member-auto-prices-install.html'
      - 'stock-sort-presets.js'
      - 'bebepick-quick-order-v24-install.html'
      - 'bebepick-firefox-one-tap.user.js'
      - 'tests/firefox-one-tap-launcher.test.cjs'
      - 'tests/firefox-v241-pick-anon.test.cjs'
      - 'tests/firefox-v25-guided-ux.test.cjs'
      - 'tests/firefox-v252-forced-shipping.test.cjs'
      - 'tests/firefox-v253-catalog-import.test.cjs'
      - 'tests/firefox-v254-sdk-read.test.cjs'
      - 'tests/firefox-v251-free-shipping.test.cjs'
      - 'bebepick-firefox-payapp-methods.user.js'
      - 'tests/firefox-payapp-methods.test.cjs'
      - 'tests/general-fast-order-v24-names.test.mjs'
      - 'tests/general-v24-payapp-one-tap-terms.test.cjs'
      - 'tests/general-v24-postclick-observation.test.cjs'
      - 'tests/general-v24-final-confirm-conditional-retry.test.cjs'
      - 'tests/general-v24-bookmark-android-boot.test.cjs'
      - '.github/workflows/quick-order-v24-names.yml'
  pull_request:
    paths:
      - 'bebepick-quick-order-general-v24.js'
      - 'index.html'
      - 'tests/upcoming-restock-threshold.test.cjs'
      - 'tests/catalog-unavailable-frontend.test.cjs'
      - 'tests/new-site-candidate-v2.test.cjs'
      - 'tests/public-archived-prices-ui.test.cjs'
      - 'tests/chrome-member-price-auto.test.cjs'
      - 'bebepick-chrome-member-auto-prices.js'
      - 'bebepick-chrome-member-auto-prices-install.html'
      - 'stock-sort-presets.js'
      - 'bebepick-quick-order-v24-install.html'
      - 'bebepick-firefox-one-tap.user.js'
      - 'tests/firefox-one-tap-launcher.test.cjs'
      - 'tests/firefox-v241-pick-anon.test.cjs'
      - 'tests/firefox-v25-guided-ux.test.cjs'
      - 'tests/firefox-v252-forced-shipping.test.cjs'
      - 'tests/firefox-v253-catalog-import.test.cjs'
      - 'tests/firefox-v254-sdk-read.test.cjs'
      - 'tests/firefox-v251-free-shipping.test.cjs'
      - 'bebepick-firefox-payapp-methods.user.js'
      - 'tests/firefox-payapp-methods.test.cjs'
      - 'tests/general-fast-order-v24-names.test.mjs'
      - 'tests/general-v24-payapp-one-tap-terms.test.cjs'
      - 'tests/general-v24-postclick-observation.test.cjs'
      - 'tests/general-v24-final-confirm-conditional-retry.test.cjs'
      - 'tests/general-v24-bookmark-android-boot.test.cjs'
      - '.github/workflows/quick-order-v24-names.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Stock dashboard upcoming estimator: existing item +10 restock rule'
        run: node --test tests/upcoming-restock-threshold.test.cjs
      - name: 'Dashboard stale catalog fallback: no unsafe ordering'
        run: node --test tests/catalog-unavailable-frontend.test.cjs
      - name: 'Public candidate v2 and disclosed inventory safety'
        run: node --test tests/new-site-candidate-v2.test.cjs
      - name: 'Archived prices and compact public cards'
        run: node --test tests/public-archived-prices-ui.test.cjs
      - name: 'Chrome private member-price auto polling and board handoff safety'
        run: node --test tests/chrome-member-price-auto.test.cjs
      - name: 'Installed SDK read transport and no Auth side effects'
        run: node --test tests/firefox-v254-sdk-read.test.cjs
      - name: 'Visible product import stays selection-only after RPC denial'
        run: node --test tests/firefox-v253-catalog-import.test.cjs
      - name: 'Forced direct shipping only at 0 won with verified seller pick'
        run: node --test tests/firefox-v252-forced-shipping.test.cjs
      - name: 'Firefox order pick and anonymous option safety tests'
        run: node --test tests/firefox-v241-pick-anon.test.cjs
      - name: 'Firefox free-shipping voucher: opt-in and official eligibility safety'
        run: node --test tests/firefox-v251-free-shipping.test.cjs
      - name: 'Firefox v2.5 guided UX, no implicit order consent'
        run: node --test tests/firefox-v25-guided-ux.test.cjs
      - name: 'Firefox Android one-tap launcher: route restrictions, no auto-submit'
        run: node --test tests/firefox-one-tap-launcher.test.cjs
      - name: Firefox PAYAPP payment method chooser safety
        run: node --test tests/firefox-payapp-methods.test.cjs
      - name: Android Chrome single-line bookmark bootstrap regression
        run: node --test tests/general-v24-bookmark-android-boot.test.cjs
      - name: PAYAPP manual bookmark consent and first-site DOM diagnostics
        run: node --test tests/general-v24-payapp-one-tap-terms.test.cjs
      - name: Read-only final-button diagnostics and existing click safety
        run: node --test tests/general-v24-postclick-observation.test.cjs tests/general-v24-submit-origin.test.cjs tests/general-v24-final-confirm-conditional-retry.test.cjs
      - name: v2.4 name candidates and legacy v2.3/2.3.1/2.3.2 regressions
        run: node --test tests/general-fast-order-v24-names.test.mjs tests/general-fast-order-v23-multi.test.mjs tests/quick-order-presubmit-v231.test.mjs tests/quick-order-presubmit-v232-names.test.mjs

