name: Pre-submit OFF to ON Diagnostic v2.3.1

on:
  pull_request:
    paths:
      - "bebepick-quick-order-preorder-test-v231.js"
      - "bebepick-preorder-transition-v231-install.html"
      - "tests/quick-order-presubmit-v231.test.mjs"
      - ".github/workflows/quick-order-presubmit-v231.yml"
  push:
    branches: [main]
    paths:
      - "bebepick-quick-order-preorder-test-v231.js"
      - "bebepick-preorder-transition-v231-install.html"
      - "tests/quick-order-presubmit-v231.test.mjs"
      - ".github/workflows/quick-order-presubmit-v231.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: v2.3.1 presubmit and legacy v2.3 regressions
        run: node --test tests/quick-order-presubmit-v231.test.mjs tests/general-fast-order-v23-multi.test.mjs
