name: Dashboard UI tests
on:
  pull_request:
    paths:
      - index.html
      - tests/**
      - .github/workflows/dashboard-ui-tests.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/**
      - .github/workflows/dashboard-ui-tests.yml

jobs:
  dashboard-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/dashboard-filters.test.mjs
