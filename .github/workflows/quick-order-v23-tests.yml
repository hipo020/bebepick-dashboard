name: Quick Order v2.3 Multi-Batch Safety

on:
  pull_request:
    paths:
      - "bebepick-quick-order-general-v23.js"
      - "bebepick-quick-order-v23-install.html"
      - "tests/general-fast-order-v23-multi.test.mjs"
      - ".github/workflows/quick-order-v23-tests.yml"
  push:
    branches: [main]
    paths:
      - "bebepick-quick-order-general-v23.js"
      - "bebepick-quick-order-v23-install.html"
      - "tests/general-fast-order-v23-multi.test.mjs"
      - ".github/workflows/quick-order-v23-tests.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify all safety, timing, and multi-cart tests
        run: node --test tests/general-fast-order-v2.test.mjs tests/general-fast-order-v22-timing.test.mjs tests/general-fast-order-v221-dom.test.mjs tests/general-fast-order-v23-multi.test.mjs
